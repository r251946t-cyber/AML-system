<!doctype html>
<html lang="en" data-theme="{{ request.cookies.get('StanPro-theme', 'dark') }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StanPro Bank | AML Intelligence</title>
    <script>
      (() => {
        const getCookieTheme = () => {
          const themeCookie = document.cookie
            .split("; ")
            .find((row) => row.startsWith("StanPro-theme="));
          return themeCookie ? decodeURIComponent(themeCookie.split("=")[1]) : "";
        };
        const savedTheme = localStorage.getItem("StanPro-theme") || getCookieTheme();
        const prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
        const theme = savedTheme || (prefersLight ? "light" : "dark");
        document.documentElement.dataset.theme = theme;
        document.cookie = `StanPro-theme=${encodeURIComponent(theme)}; Max-Age=31536000; Path=/; SameSite=Lax`;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <div class="page-shell{% if request.endpoint in ('login', 'register') %} no-sidebar{% endif %}">
      <header class="topbar">
        <div class="brand-block">
          <button class="sidebar-toggle" type="button" aria-label="Toggle sidebar" id="sidebar-toggle">
            <svg viewBox="0 0 24 24">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <div class="brand-mark brand-mark--stacked">
            <span>StanPro</span>
            <span>Bank</span>
          </div>
          <div>
            <p>Banking &bull; Insurance &bull; Investments</p>
          </div>
        </div>
        
        <!-- Messaging Link -->
        <div class="topbar-actions">
          <a href="{{ url_for('messages') }}" class="topbar-message-link" title="Messages">
            <svg viewBox="0 0 24 24" width="24" height="24">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            <span class="message-badge" id="messageBadge" style="display: none;">0</span>
          </a>
        </div>
      </header>

      <main>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <ul class="flash-messages">
              {% for message in messages %}
                <li>{{ message }}</li>
              {% endfor %}
            </ul>
          {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
      </main>
      
      <button id="back-to-top" class="back-to-top" aria-label="Back to top">↑</button>
    </div>
    <script>
      // Auto-fade flash messages after 4 seconds
      document.querySelectorAll(".flash-messages").forEach((flash) => {
        window.setTimeout(() => {
          flash.classList.add("is-clearing");
          flash.addEventListener("transitionend", () => flash.remove(), { once: true });
        }, 4000);
      });

      // Sidebar toggle functionality
      const sidebarToggle = document.getElementById('sidebar-toggle');
      if (sidebarToggle) {
        window.toggleGlobalSidebar = () => {
          if (window.__amlSidebarController && typeof window.__amlSidebarController.toggle === 'function') {
            window.__amlSidebarController.toggle();
            return;
          }
          const event = new CustomEvent('sidebar-toggle-click');
          window.dispatchEvent(event);
        };

        sidebarToggle.addEventListener('click', (event) => {
          event.preventDefault();
          window.toggleGlobalSidebar();
        });
      }

      // Scroll-based fade effect for sidebar toggle
      let lastScrollY = window.scrollY;
      const handleScroll = () => {
        const currentScrollY = window.scrollY;
        const toggle = document.getElementById('sidebar-toggle');
        if (toggle) {
          if (currentScrollY > lastScrollY && currentScrollY > 50) {
            toggle.classList.add('hidden');
          } else {
            toggle.classList.remove('hidden');
          }
        }
        lastScrollY = currentScrollY;
      };
      window.addEventListener('scroll', handleScroll);

      // Back to top button functionality
      const backToTop = document.getElementById("back-to-top");
      if (backToTop) {
        window.addEventListener("scroll", () => {
          if (window.scrollY > 300) {
            backToTop.classList.add("visible");
          } else {
            backToTop.classList.remove("visible");
          }
        });

        backToTop.addEventListener("click", () => {
          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });
        });
      }

      // Messaging badge update
      function updateUnreadBadge() {
        const badge = document.getElementById('messageBadge');
        if (!badge) return;

        fetch('/api/unread-count')
          .then(response => response.json())
          .then(data => {
            if (data.status === 'success') {
              const totalUnread = data.unread.total_unread;
              if (totalUnread > 0) {
                badge.textContent = totalUnread;
                badge.style.display = 'flex';
              } else {
                badge.style.display = 'none';
              }
            }
          })
          .catch(error => console.error('Error fetching unread count:', error));
      }

      // Load unread badge on page load
      document.addEventListener('DOMContentLoaded', updateUnreadBadge);

      // Connect to WebSocket and listen for message updates
      if (typeof io !== 'undefined') {
        const socket = io();
        
        socket.on('unread_update', (data) => {
          updateUnreadBadge();
        });

        socket.on('new_message', (data) => {
          updateUnreadBadge();
        });
      }
    </script>
  </body>
</html>
