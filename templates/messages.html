<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - AML System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .messaging-container {
            display: flex;
            height: 100vh;
            background-color: #fff;
            gap: 0;
        }

        /* Sidebar / Conversations List */
        .conversations-panel {
            width: 320px;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            background-color: #fff;
        }

        .conversations-header {
            padding: 16px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .conversations-header h2 {
            font-size: 24px;
            font-weight: 500;
        }

        .search-box {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
        }

        .search-box input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 20px;
            background-color: #f0f0f0;
            font-size: 14px;
        }

        .conversations-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
        }

        .conversation-item {
            padding: 12px 8px;
            margin: 4px 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
        }

        .conversation-item:hover {
            background-color: #f2f2f2;
        }

        .conversation-item.active {
            background-color: #e8f5e9;
        }

        .conversation-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
            flex-shrink: 0;
            position: relative;
        }

        .conversation-avatar.online::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 12px;
            height: 12px;
            background-color: #4caf50;
            border: 2px solid white;
            border-radius: 50%;
        }

        .conversation-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .conversation-name {
            font-weight: 500;
            color: #000;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conversation-preview {
            font-size: 12px;
            color: #999;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .unread-badge {
            background-color: #2196f3;
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            flex-shrink: 0;
        }

        /* Chat Area */
        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #fff;
        }

        .chat-header {
            padding: 16px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-title {
            font-size: 16px;
            font-weight: 600;
        }

        .user-status {
            font-size: 12px;
            color: #999;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #4caf50;
            display: inline-block;
            margin-right: 4px;
        }

        .status-indicator.offline {
            background-color: #999;
        }

        /* Messages Area */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            font-size: 16px;
        }

        .message-group {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-group.sent {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 55%;
            padding: 10px 14px;
            border-radius: 12px;
            word-wrap: break-word;
            word-break: break-word;
        }

        .message-group.received .message-bubble {
            background-color: #e8e8e8;
            color: #000;
            border-bottom-left-radius: 4px;
        }

        .message-group.sent .message-bubble {
            background-color: #2196f3;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-time {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
        }

        .message-group.sent .message-time {
            text-align: right;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 10px 14px;
            background-color: #e8e8e8;
            border-radius: 12px;
            width: fit-content;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #999;
            animation: bounce 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                opacity: 0.5;
            }
            40% {
                opacity: 1;
            }
        }

        /* Input Area */
        .input-area {
            padding: 16px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            gap: 8px;
        }

        .message-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 20px;
            resize: none;
            max-height: 100px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }

        .message-input:focus {
            border-color: #2196f3;
        }

        .send-button {
            background-color: #2196f3;
            color: white;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: background-color 0.2s;
        }

        .send-button:hover {
            background-color: #1976d2;
        }

        .send-button:active {
            background-color: #1565c0;
        }

        /* No conversation selected */
        .no-conversation {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            font-size: 18px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .conversations-panel {
                display: none;
            }

            .message-bubble {
                max-width: 85%;
            }
        }

        /* Scrollbar styling */
        .conversations-list::-webkit-scrollbar,
        .messages-container::-webkit-scrollbar {
            width: 6px;
        }

        .conversations-list::-webkit-scrollbar-track,
        .messages-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .conversations-list::-webkit-scrollbar-thumb,
        .messages-container::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 3px;
        }

        .conversations-list::-webkit-scrollbar-thumb:hover,
        .messages-container::-webkit-scrollbar-thumb:hover {
            background: #999;
        }
    </style>
</head>
<body>
    <div class="messaging-container">
        <!-- Conversations Sidebar -->
        <div class="conversations-panel">
            <div class="conversations-header">
                <h2>Messages</h2>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search conversations...">
            </div>
            <ul class="conversations-list" id="conversationsList">
                <li class="empty-state">No conversations yet</li>
            </ul>
        </div>

        <!-- Chat Area -->
        <div class="chat-panel">
            <div id="chatArea" class="no-conversation">
                <div>Select a conversation to start messaging</div>
            </div>
            
            <div id="chatContent" style="display: none; flex: 1; display: flex; flex-direction: column;">
                <div class="chat-header">
                    <div class="chat-header-info">
                        <div>
                            <div class="chat-title" id="chatTitle"></div>
                            <div class="user-status">
                                <span class="status-indicator" id="statusIndicator"></span>
                                <span id="userStatus">Offline</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="messages-container" id="messagesContainer">
                    <!-- Messages will be loaded here -->
                </div>

                <div class="input-area">
                    <div class="input-wrapper">
                        <textarea class="message-input" id="messageInput" placeholder="Type a message..." rows="1"></textarea>
                    </div>
                    <button class="send-button" id="sendButton" title="Send message">➤</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        const socket = io();
        let currentConversation = null;
        let messageableUsers = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadConversations();
            loadMessageableUsers();
            setupEventListeners();
        });

        // Setup event listeners
        function setupEventListeners() {
            document.getElementById('sendButton').addEventListener('click', sendMessage);
            document.getElementById('messageInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            document.getElementById('messageInput').addEventListener('input', () => {
                const content = document.getElementById('messageInput').value.trim();
                if (content) {
                    socket.emit('typing', { conversation_id: currentConversation });
                }
            });

            document.getElementById('searchInput').addEventListener('input', filterConversations);
        }

        // Load conversations
        async function loadConversations() {
            try {
                const response = await fetch('/api/conversations');
                const data = await response.json();

                if (data.status === 'success') {
                    displayConversations(data.conversations);
                }
            } catch (error) {
                console.error('Error loading conversations:', error);
            }
        }

        // Load messageable users
        async function loadMessageableUsers() {
            try {
                const response = await fetch('/api/messageable-users');
                const data = await response.json();

                if (data.status === 'success') {
                    messageableUsers = data.users;
                }
            } catch (error) {
                console.error('Error loading messageable users:', error);
            }
        }

        // Display conversations
        function displayConversations(conversations) {
            const list = document.getElementById('conversationsList');
            list.innerHTML = '';

            if (conversations.length === 0) {
                list.innerHTML = '<li class="empty-state">No conversations yet</li>';
                return;
            }

            conversations.forEach(conv => {
                const li = document.createElement('li');
                li.className = 'conversation-item';
                if (conv.id === currentConversation) {
                    li.classList.add('active');
                }

                const otherUser = messageableUsers.find(u => u.username === conv.other_participant);
                const initials = conv.other_participant.substring(0, 2).toUpperCase();
                const isOnline = otherUser && otherUser.is_online;

                li.innerHTML = `
                    <div class="conversation-avatar ${isOnline ? 'online' : ''}">
                        ${initials}
                    </div>
                    <div class="conversation-info">
                        <div class="conversation-name">${conv.other_participant}</div>
                        <div class="conversation-preview">${conv.content || 'No messages yet'}</div>
                    </div>
                    ${conv.unread_count > 0 ? `<div class="unread-badge">${conv.unread_count}</div>` : ''}
                `;

                li.addEventListener('click', () => selectConversation(conv));
                list.appendChild(li);
            });
        }

        // Select conversation
        async function selectConversation(conv) {
            currentConversation = conv.id;
            document.getElementById('chatArea').style.display = 'none';
            document.getElementById('chatContent').style.display = 'flex';
            document.getElementById('chatTitle').textContent = conv.other_participant;

            // Update status indicator
            const otherUser = messageableUsers.find(u => u.username === conv.other_participant);
            if (otherUser) {
                document.getElementById('statusIndicator').className = `status-indicator ${otherUser.is_online ? '' : 'offline'}`;
                document.getElementById('userStatus').textContent = otherUser.is_online ? 'Online' : 'Offline';
            }

            // Load messages
            loadMessages(conv.id);

            // Mark as read
            socket.emit('mark_read', { conversation_id: conv.id });

            // Update UI
            loadConversations();
        }

        // Load messages
        async function loadMessages(conversationId) {
            try {
                const response = await fetch(`/api/conversations/${conversationId}/messages`);
                const data = await response.json();

                if (data.status === 'success') {
                    displayMessages(data.messages.reverse());
                }
            } catch (error) {
                console.error('Error loading messages:', error);
            }
        }

        // Display messages
        function displayMessages(messages) {
            const container = document.getElementById('messagesContainer');
            const currentUser = '{{ session.get("username", "") }}';
            container.innerHTML = '';

            messages.forEach(msg => {
                const group = document.createElement('div');
                group.className = `message-group ${msg.sender_username === currentUser ? 'sent' : 'received'}`;

                const time = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                group.innerHTML = `
                    <div>
                        <div class="message-bubble">${escapeHtml(msg.content)}</div>
                        <div class="message-time">${time}</div>
                    </div>
                `;

                container.appendChild(group);
            });

            container.scrollTop = container.scrollHeight;
        }

        // Send message
        function sendMessage() {
            const content = document.getElementById('messageInput').value.trim();

            if (!content || !currentConversation) {
                return;
            }

            const conversationItem = document.querySelector(`[data-conversation-id="${currentConversation}"]`);
            if (!conversationItem) {
                return;
            }

            const receiver = document.getElementById('chatTitle').textContent;

            socket.emit('send_message', {
                receiver: receiver,
                content: content,
                conversation_id: currentConversation
            });

            document.getElementById('messageInput').value = '';
            document.getElementById('messageInput').style.height = 'auto';
            socket.emit('stop_typing', { conversation_id: currentConversation });
        }

        // WebSocket events
        socket.on('new_message', (message) => {
            if (message.conversation_id === currentConversation) {
                const container = document.getElementById('messagesContainer');
                const group = document.createElement('div');
                const currentUser = '{{ session.get("username", "") }}';
                group.className = `message-group ${message.sender === currentUser ? 'sent' : 'received'}`;

                const time = new Date(message.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                group.innerHTML = `
                    <div>
                        <div class="message-bubble">${escapeHtml(message.content)}</div>
                        <div class="message-time">${time}</div>
                    </div>
                `;

                container.appendChild(group);
                container.scrollTop = container.scrollHeight;
            }

            loadConversations();
        });

        socket.on('user_typing', (data) => {
            if (data.conversation_id === currentConversation && data.user !== '{{ session.username }}') {
                // Show typing indicator
                const container = document.getElementById('messagesContainer');
                const existing = container.querySelector('.typing-indicator');
                if (!existing) {
                    const indicator = document.createElement('div');
                    indicator.className = 'typing-indicator';
                    indicator.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
                    container.appendChild(indicator);
                    container.scrollTop = container.scrollHeight;
                }
            }
        });

        socket.on('user_stop_typing', (data) => {
            if (data.conversation_id === currentConversation) {
                const container = document.getElementById('messagesContainer');
                const indicator = container.querySelector('.typing-indicator');
                if (indicator) {
                    indicator.remove();
                }
            }
        });

        socket.on('unread_update', (unread) => {
            loadConversations();
        });

        // Auto-resize textarea
        document.getElementById('messageInput').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px';
        });

        // Filter conversations
        function filterConversations() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const items = document.querySelectorAll('.conversation-item');

            items.forEach(item => {
                const name = item.querySelector('.conversation-name').textContent.toLowerCase();
                item.style.display = name.includes(query) ? '' : 'none';
            });
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
